name: Feature request
description: Propose new functionality or an improvement
labels: ["enhancement"]
body:
    - type: markdown
      attributes:
          value: Thanks for proposing an idea! Please describe the problem you are trying to solve, not just the solution.
    - type: textarea
      id: problem
      attributes:
          label: Problem statement
          description: What use case is not well served today?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: API sketch, behavior and expected semantics
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Core contract evaluation
              - Async / promises
              - Object invariants
              - Class contracts / decorators
              - Contract inheritance
              - Modes / configuration
              - Error handling / reporting
              - Tooling / DX / docs
              - Other
      validations:
          required: true
