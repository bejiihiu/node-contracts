version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "07:00"
      open-pull-requests-limit: 5
      labels:
          - dependencies
      commit-message:
          prefix: chore(deps)
          include: scope
      groups:
          development:
              dependency-type: development
          production:
              dependency-type: production
      ignore:
          # tsup's classic dts pipeline works reliably only with TS 5.x;
          # don't auto-bump the major until that changes intentionally
          - dependency-name: typescript
            update-types:
                - version-update:semver-major

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "07:00"
      open-pull-requests-limit: 3
      labels:
          - dependencies
          - ci
      commit-message:
          prefix: chore(ci)
          include: scope
      groups:
          actions:
              patterns:
                  - "*"
