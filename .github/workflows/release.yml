name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

permissions:
    contents: write # needed for creating the GitHub Release
    id-token: write # needed for npm provenance

jobs:
    release:
        name: publish to npm
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # only relevant on tag pushes - dispatch publishes nothing anyway
            - name: Verify tag matches package.json version
              if: github.ref_type == 'tag'
              run: |
                  PKG_VERSION="$(node -p "require('./package.json').version")"
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
                      echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
                      exit 1
                  fi
                  echo "tag $GITHUB_REF_NAME matches package.json version $PKG_VERSION"

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

            - name: publint
              run: bun run publint

            - name: attw
              run: bun run attw

            # workflow_dispatch never publishes. It answers "is this ref
            # releasable?" by running the same gates plus a tarball listing,
            # without touching the registry or needing secrets. `npm pack
            # --dry-run` prints the file list and validates the manifest with
            # no auth and no side effects. (`npm publish --dry-run` was
            # considered and skipped: it re-runs prepublishOnly and its
            # registry round-trip can't be smoke-tested without NPM_TOKEN.)
            - name: Pack contents (report only)
              if: github.ref_type != 'tag'
              run: |
                  echo "::warning::workflow_dispatch does not publish to npm - tagging v*.*.* does that. This run only verifies the package."
                  npm pack --dry-run

            # note: `npm publish` re-runs `prepublishOnly` (clean + build + publint + attw)
            # on its own, the steps above are an explicit gate before the publish.
            # only tag pushes publish - dispatch stays a no-op for the registry.
            - name: Publish to npm
              if: github.ref_type == 'tag'
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # skipped on workflow_dispatch - only tag pushes get a GitHub Release
            - name: Create GitHub Release
              if: github.ref_type == 'tag'
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
