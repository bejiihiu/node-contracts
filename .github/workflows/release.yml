name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

permissions:
    contents: write # needed for creating the GitHub Release
    id-token: write # needed for npm provenance

jobs:
    release:
        name: publish to npm
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

            - name: publint
              run: bun run publint

            - name: attw
              run: bun run attw

            # note: `npm publish` re-runs `prepublishOnly` (clean + build + publint + attw)
            # on its own, the steps above are an explicit gate before the publish
            - name: Publish to npm
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # skipped on workflow_dispatch - only tag pushes get a GitHub Release
            - name: Create GitHub Release
              if: github.ref_type == 'tag'
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
