name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # cancel outdated runs on PRs, let main runs finish
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        name: test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint & format check
              run: bunx biome ci .

            - name: Typecheck
              run: bun run typecheck

            - name: Build
              run: bun run build

            - name: Test
              run: bunx vitest run

    node-compat:
        name: node ${{ matrix.node-version }} (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                node-version: [18, 20, 22, 'lts/*']
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            # we smoke-test the built dual package on every supported node line
            # (unit suite runs under bun instead). build goes through bun on purpose:
            # tsup's bin resolves the system node, and old lines can't run tsup's deps.
            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun --bun run build

            - name: Smoke test (CommonJS)
              run: |
                  node --eval "const { contract, PreconditionViolationError } = require('./dist/index.cjs'); const divide = contract((a, b) => a / b, { pre: [(a, b) => b !== 0] }); if (divide(10, 2) !== 5) throw new Error('smoke: expected 5'); let threw = false; try { divide(1, 0); } catch (err) { threw = err instanceof PreconditionViolationError; } if (!threw) throw new Error('smoke: expected PreconditionViolationError'); console.log('cjs smoke ok');"

            - name: Smoke test (ESM)
              run: |
                  node --input-type=module --eval "import { contract, PreconditionViolationError } from './dist/index.js'; const divide = contract((a, b) => a / b, { pre: [(a, b) => b !== 0] }); if (divide(10, 2) !== 5) throw new Error('smoke: expected 5'); let threw = false; try { divide(1, 0); } catch (err) { threw = err instanceof PreconditionViolationError; } if (!threw) throw new Error('smoke: expected PreconditionViolationError'); console.log('esm smoke ok');"

    quality:
        name: quality
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint & format check
              run: bunx biome ci .

            - name: Typecheck
              run: bun run typecheck

            - name: Build
              run: bun run build

            - name: publint
              run: bun run publint

            - name: attw
              run: bun run attw

    coverage:
        name: coverage
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run tests with coverage
              run: bunx vitest run --coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage
                  path: coverage/
                  retention-days: 14
                  if-no-files-found: error
